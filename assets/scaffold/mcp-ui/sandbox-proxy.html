<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MCP-UI sandbox proxy</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: transparent; }
  iframe { display: block; width: 100%; height: 100%; border: 0; background: transparent; }
</style>
</head>
<body>
<script>
/**
 * MCP Apps sandbox proxy — the middle layer of the double-iframe architecture.
 *
 * DEVELOPMENT ASSET. Neither @mcp-ui/client nor @modelcontextprotocol/ext-apps
 * ships a proxy page; the host must provide one. This implements the contract
 * observed in the shipped @mcp-ui/client@7.1.1 bundle:
 *
 *   host  →  creates THIS page in an outer iframe and waits for
 *            { method: "ui/notifications/sandbox-proxy-ready" }
 *   host  →  { method: "ui/notifications/sandbox-resource-ready",
 *              params: { html, sandbox?, csp? } }
 *   here  →  creates the INNER iframe with that html + sandbox attribute
 *   both  →  every other message is relayed verbatim between host and guest
 *
 * ── Which iframe carries which sandbox ───────────────────────────────────────
 * The host hardcodes `allow-scripts allow-same-origin allow-forms` on the OUTER
 * iframe (this page) and does not expose it. The `permissions` value passed in
 * `SandboxConfig` arrives here as `params.sandbox` and applies to the INNER
 * iframe — the one actually holding server-supplied content. That is the
 * boundary that matters, and it is the one a gate should assert.
 *
 * ── Why srcdoc, and why no allow-same-origin by default ──────────────────────
 * The inner frame is loaded via `srcdoc` with no `allow-same-origin`, so it is
 * an OPAQUE origin: it cannot read this page, cannot reach the host's cookies
 * or storage, and its messages arrive with `origin: "null"`. That last part is
 * why the host pairs its origin check with `event.source` — "null" is a value
 * any opaque frame can present.
 */
(function () {
  'use strict';

  var PROXY_READY = 'ui/notifications/sandbox-proxy-ready';
  var RESOURCE_READY = 'ui/notifications/sandbox-resource-ready';
  var DEFAULT_SANDBOX = 'allow-scripts allow-forms';

  var hostWindow = window.parent;
  var hostOrigin = null;   // learned from the first host message
  var inner = null;

  function cspToMeta(csp) {
    if (!csp || typeof csp !== 'object') return '';
    var parts = [];
    Object.keys(csp).forEach(function (directive) {
      var value = csp[directive];
      var list = Array.isArray(value) ? value.join(' ') : String(value);
      parts.push(directive + ' ' + list);
    });
    if (!parts.length) return '';
    return '<meta http-equiv="Content-Security-Policy" content="' +
      parts.join('; ').replace(/"/g, '&quot;') + '">';
  }

  function mountGuest(params) {
    if (inner) inner.remove();
    inner = document.createElement('iframe');

    // The sandbox the host asked for, applied to the frame that holds
    // server-supplied content. Absent an override, deny same-origin.
    inner.setAttribute('sandbox', params.sandbox || DEFAULT_SANDBOX);
    inner.setAttribute('data-mcp-ui-guest', 'true');

    var meta = cspToMeta(params.csp);
    var html = String(params.html || '');
    // Inject the CSP as the first thing in <head> so it governs the document.
    inner.setAttribute(
      'srcdoc',
      meta ? html.replace(/<head([^>]*)>/i, '<head$1>' + meta) : html
    );

    document.body.appendChild(inner);
  }

  // Relay: host → guest, and guest → host. The proxy does not interpret
  // application messages; it only owns the frame lifecycle.
  window.addEventListener('message', function (event) {
    var data = event.data;

    if (event.source === hostWindow) {
      if (hostOrigin === null) hostOrigin = event.origin;
      if (data && data.method === RESOURCE_READY && data.params) {
        mountGuest(data.params);
        return;
      }
      if (inner && inner.contentWindow) inner.contentWindow.postMessage(data, '*');
      return;
    }

    if (inner && event.source === inner.contentWindow) {
      hostWindow.postMessage(data, hostOrigin || '*');
    }
  });

  // Announce readiness. The host waits on exactly this before sending the
  // resource, and times out after 10s if it never arrives.
  hostWindow.postMessage({ jsonrpc: '2.0', method: PROXY_READY, params: {} }, '*');
})();
</script>
</body>
</html>
