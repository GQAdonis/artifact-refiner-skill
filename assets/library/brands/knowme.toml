tagline = "Identity layer for human-AI collaboration"
description = "KnowMe LLC dark brand system."

[colors.light]
bg       = "#F8FAFC"
surface  = "#FFFFFF"
ink      = "#0B0F14"
muted    = "#4A5970"
ember    = "#E04E28"
ember_alt = "#FF6A3D"
info     = "#3B82F6"
